version: '3.8'

services:
  leader:
    build: .
    container_name: kv_leader
    command: python app.py
    ports:
      - "5000:5000"
    environment:
      - ROLE=leader
      - PORT=5000
      - WRITE_QUORUM=3
      - MIN_DELAY=0
      - MAX_DELAY=1
      - FOLLOWERS=http://follower1:5001,http://follower2:5002,http://follower3:5003,http://follower4:5004,http://follower5:5005
    networks:
      - kv_network

  follower1:
    build: .
    container_name: kv_follower1
    command: python app.py
    ports:
      - "5001:5001"
    environment:
      - ROLE=follower
      - PORT=5001
    networks:
      - kv_network

  follower2:
    build: .
    container_name: kv_follower2
    command: python app.py
    ports:
      - "5002:5002"
    environment:
      - ROLE=follower
      - PORT=5002
    networks:
      - kv_network

  follower3:
    build: .
    container_name: kv_follower3
    command: python app.py
    ports:
      - "5003:5003"
    environment:
      - ROLE=follower
      - PORT=5003
    networks:
      - kv_network

  follower4:
    build: .
    container_name: kv_follower4
    command: python app.py
    ports:
      - "5004:5004"
    environment:
      - ROLE=follower
      - PORT=5004
    networks:
      - kv_network

  follower5:
    build: .
    container_name: kv_follower5
    command: python app.py
    ports:
      - "5005:5005"
    environment:
      - ROLE=follower
      - PORT=5005
    networks:
      - kv_network

networks:
  kv_network:
    driver: bridge
